<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2d32" />
      <stop offset="100%" stop-color="#0b1315" />
    </radialGradient>

    <!-- Accent Text & Border Gradient -->
    <linearGradient id="aquaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64dfdf" />
      <stop offset="100%" stop-color="#38b6ff" />
    </linearGradient>

    <!-- Glowing Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Glowing Accent Ring -->
  <rect 
    x="24" 
    y="24" 
    width="464" 
    height="464" 
    rx="104" 
    fill="none" 
    stroke="url(#aquaGrad)" 
    stroke-width="12" 
    stroke-opacity="0.4"
    filter="url(#glow)"
  />

  <!-- Initials Text (J.C) -->
  <text 
    x="50%" 
    y="54%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="210" 
    letter-spacing="-6"
    fill="url(#aquaGrad)"
    filter="url(#glow)"
  >
    J.C
  </text>
</svg>
